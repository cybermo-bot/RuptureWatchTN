name: Keep-alive

# Calls /api/health once a day so the free Supabase project is not paused for inactivity.
# Set the repository variable HEALTH_URL (Settings, Secrets and variables, Actions, Variables)
# to the deployed health endpoint, e.g. https://<project>.vercel.app/api/health

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the health endpoint
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "Repository variable HEALTH_URL is not set." >&2
            exit 1
          fi
          body=$(curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 "$HEALTH_URL")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
